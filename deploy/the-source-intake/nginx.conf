# The Source waiting room (KEI-932). Added to the existing source-mcp.de-alwis.com server block, beside /mcp.
# Producers authenticate with their own bearer credential; only the signed batch, health and the contract are
# public. The server is bound to 127.0.0.1:8852. No access log.
#
# At http level (top of the site file, next to the_source_mcp):
#   limit_req_zone $binary_remote_addr zone=the_source_intake:10m rate=30r/m;
location /intake/v1/ {
    limit_req zone=the_source_intake burst=10 nodelay;
    limit_req_status 429;
    limit_except GET POST { deny all; }
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8852;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

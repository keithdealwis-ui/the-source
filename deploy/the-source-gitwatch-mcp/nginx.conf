# The Source GitWatch MCP adapter (KEI-932). Added to the source-mcp.de-alwis.com server block, beside /mcp and
# /intake/v1/. The adapter is bound to 127.0.0.1:8853. No access log (authorization codes travel in query strings).
# OAuth metadata is published only at the GitWatch-specific well-known paths, never at the host root, so the
# anonymous /mcp is unaffected.
#
# At http level (top of the site file):
#   limit_req_zone $binary_remote_addr zone=the_source_gitwatch:10m rate=60r/m;
location /gitwatch/ {
    access_log off;
    limit_req zone=the_source_gitwatch burst=20 nodelay;
    limit_req_status 429;
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8853;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}
location = /.well-known/oauth-protected-resource/gitwatch/mcp {
    limit_req zone=the_source_gitwatch burst=20 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8853;
}
location = /.well-known/oauth-authorization-server/gitwatch {
    limit_req zone=the_source_gitwatch burst=20 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8853;
}

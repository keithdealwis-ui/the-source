# The Source MCP (KEI-851): public, anonymous, read-only. nginx is the only public listener; the server is
# bound to 127.0.0.1:8851. No access log (no client addresses are stored). certbot --nginx adds TLS.
limit_req_zone $binary_remote_addr zone=the_source_mcp:10m rate=60r/m;

server {
    server_name source-mcp.de-alwis.com;
    server_tokens off;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    location = /mcp {
        limit_req zone=the_source_mcp burst=20 nodelay;
        limit_req_status 429;
        limit_except POST GET DELETE { deny all; }
        proxy_pass http://127.0.0.1:8851;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8851;
    }
    location / {
        return 404;
    }

    listen 80;
}

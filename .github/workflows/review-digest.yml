name: Weekly review digest

# KEI-783 AC5. The daily cycle refreshes the data and commits it to main by itself
# (daily-cycle.yml, unchanged). Once a week this job reads what those cycles committed,
# writes a digest of the changes worth a human look (python -m source_pipeline
# review-digest, docs/OPERATIONS.md "Human review digest") and PROPOSES it as a pull
# request on the branch review/YYYY-Www. Nothing here changes the dataset and nothing is
# merged automatically.
#
# Idempotent: a re-run in the same ISO week updates the same branch and pull request (or
# does nothing when the digest is unchanged). The review/* branches are written by this
# job only. Needs the repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General) for gh pr create with GITHUB_TOKEN.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, after the night's cycle
  workflow_dispatch:
    inputs:
      since_days:
        description: "Window length in days"
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # the window is measured from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build the digest from the committed history (no network)
        id: digest
        env:
          THE_SOURCE_NO_NETWORK: "1"
          SINCE_DAYS: ${{ github.event.inputs.since_days || '7' }}
        run: |
          python -m source_pipeline review-digest --since-days "$SINCE_DAYS" --out reviews | tee digest.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("digest.json"))
          print(f"week={d['week']}")
          print(f"items={d['review_items']}")
          EOF

      - name: Propose the digest as a pull request
        if: steps.digest.outputs.items != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.digest.outputs.week }}
        run: |
          BRANCH="review/$WEEK"
          MD="reviews/digest-$WEEK.md"
          JS="reviews/digest-$WEEK.json"
          git config user.name "the-source-review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --quiet origin "$BRANCH" 2>/dev/null \
             && git show "FETCH_HEAD:$JS" > previous.json 2>/dev/null \
             && cmp -s previous.json "$JS"; then
            echo "review digest $WEEK: unchanged on $BRANCH"
            CHANGED=0
          else
            git switch -C "$BRANCH"
            git add "$MD" "$JS"
            git commit -q -m "review: digest $WEEK" -m "Generated by python -m source_pipeline review-digest (KEI-783)."
            git push --force origin "$BRANCH"
            CHANGED=1
          fi

          head -c 60000 "$MD" > pr-body.md
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -n "$PR" ]; then
            if [ "$CHANGED" = 1 ]; then
              gh pr edit "$PR" --title "Review digest $WEEK" --body-file pr-body.md
            fi
            echo "review digest $WEEK: pull request #$PR" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$BRANCH" --title "Review digest $WEEK" --body-file pr-body.md
            echo "review digest $WEEK: pull request opened" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nothing to review
        if: steps.digest.outputs.items == '0'
        run: |
          echo "review digest ${{ steps.digest.outputs.week }}: no meaningful change; no pull request" >> "$GITHUB_STEP_SUMMARY"

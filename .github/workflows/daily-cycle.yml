name: Daily intelligence cycle

# KEI-848 (daily), built on KEI-807 criteria 9-12 (weekly). The cron below is only a
# wake-up: every hour the job asks `source_pipeline cycle-due` whether config/schedule.yaml
# says a cycle is due (default every day 03:00 Asia/Dubai, 4-hour window, 16-hour catch-up).
# Change the schedule there, not here.
#
# One cycle at a time (concurrency group canonical-writer on the cycle job). Intake jobs
# only ADD files (an outcome and, if admitted, a ledger entry) that a cycle never writes,
# and every job rebases before pushing, so concurrent intake never conflicts with a cycle.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run a cycle now (recorded in the job summary)"
        required: false
      drill_fail_at:
        description: "Failure drill: stop the cycle at this step (nothing is promoted)"
        required: false
        default: none
        type: choice
        options: [none, light_refresh, canonical, history, community_radar]

permissions:
  contents: write
  issues: write

jobs:
  # Hourly wake-up. Cheap, and deliberately outside the writer concurrency group: GitHub
  # keeps only one pending job per group and cancels the older, so no-op wake-ups must
  # never queue there.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Is a cycle due?
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python -m source_pipeline cycle-due | tee due.json
            echo "due=$(python -c 'import json;print(str(json.load(open("due.json"))["due"]).lower())')" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  cycle:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: canonical-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore upstream checkouts
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ hashFiles('config/sources.yaml', 'data/state/source_pins.json') }}
          restore-keys: raw-

      - name: Run the cycle
        id: cycle
        continue-on-error: true
        env:
          # A dedicated read-only token raises the API budget; the job token works without it.
          GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN || github.token }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRILL: ${{ inputs.drill_fail_at }}
        run: |
          if [ "$TRIGGER" = "manual" ] && [ -n "$DRILL" ] && [ "$DRILL" != "none" ]; then
            export THE_SOURCE_DRILL_FAIL_AT="$DRILL"
          fi
          python -m source_pipeline cycle --trigger "$TRIGGER"

      - name: Commit the result (promoted data on success; the run record always)
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          RUN=$(python - <<'PY'
          import json, glob
          rs = [json.load(open(p)) for p in glob.glob("runs/*.json")]
          print(max(rs, key=lambda r: r["started_at"])["run_id"])
          PY
          )
          STATUS=$(python -c "import json;print(json.load(open('runs/$RUN.json'))['status'])")
          VERSION=$(python -c "import json;print(json.load(open('runs/$RUN.json'))['canonical']['dataset_version_after'])")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          git config user.name "the-source-cycle"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/
          if [ "$STATUS" = "succeeded" ]; then git add data api; fi
          git commit -m "cycle: $RUN $STATUS (dataset $VERSION)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
            sleep $((i * 10))
          done
          git fetch origin "$BRANCH" && git merge-base --is-ancestor HEAD "origin/$BRANCH" || { echo "push failed"; exit 1; }
          if [ "$STATUS" = "succeeded" ]; then git tag -f "cycle/$RUN" && git push origin "cycle/$RUN"; fi
          {
            echo "## Cycle $RUN: $STATUS"
            echo
            echo '```json'
            python -c "import json;r=json.load(open('runs/$RUN.json'));print(json.dumps({k:r.get(k) for k in ('status','counts','canonical','timings_s','retries','failures','error')},indent=2))"
            echo '```'
            echo
            echo '### Strategies'
            echo
            echo '```'
            python -c "import json;r=json.load(open('runs/$RUN.json'));[print(s['id'], s.get('status')) for s in r['strategies']]"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface the outcome durably
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.commit.outputs.run }}
          STATUS: ${{ steps.commit.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create cycle-failure --color B60205 --description "Daily cycle failed" 2>/dev/null || true
          OPEN=$(gh issue list --label cycle-failure --state open --json number --jq '.[0].number')
          if [ "$STATUS" != "succeeded" ]; then
            BODY="Run \`${RUN:-unknown}\` ended ${STATUS:-without a run record}. The last known-good dataset is unchanged. Record: runs/$RUN.json. Log: $RUN_URL. The next wake-up inside the window retries automatically."
            if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --body "$BODY"
            else gh issue create --title "Daily cycle failing" --label cycle-failure --body "$BODY"; fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Recovered: run \`$RUN\` succeeded ($RUN_URL)."
          fi

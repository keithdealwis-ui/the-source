# The Source — what each SaaS category is bought to do (KEI-806, Replacement Fit).
#
# `core`: the primary job, as groups of evidence terms. The FIRST group is the defining group:
# specific phrases for what the product IS. It must be evidenced in the project's identity
# text (description, topics, upstream category, README opening) or the core gate fails. Other
# groups are the job's verbs/objects. Core use-case coverage is the credited share of groups
# (full credit in identity text, reduced credit deeper in the README) and gates Replacement
# Fit (config/scoring.yaml replacement_fit.core_gate).
#
# v1.1.0 (2026-09-29): defining groups tightened after a negative control (every pair scored
# against a randomly mismatched category) showed v1.0.0 passing 49% of mismatched pairs:
# generic stems ("analytic", "docs", "api", "database") matched almost any README.
# v1.1.0 calibration: the 47 true pairs v1.1.0 gated were each reviewed by hand; where a real
# alternative describes itself in words the defining group missed (Thumbor "imaging service",
# Harbor "cloud native registry", vLLM "inference engine", Healthchecks "cron job monitor",
# MediaCMS "video and media CMS", Moodle "learning platform", Vale "linter for prose", rrweb
# "record and replay", ...), the phrase was added. Correct gatings were left gated (Plausible
# vs Mixpanel, Grafana vs Better Stack, GIMP vs Canva, Docusaurus vs ReadMe, mailcow vs SES).
# The negative control is re-run by score-validate after every change.
# `features`: the breadth checklist behind Feature equivalence; share of terms evidenced.
#
# These are desk-authored descriptions of a category's job, not claims about any product.
# They are deliberately generic so a project is judged on the job, not on marketing words.
# Authored 2026-09-29 by claude-code for KEI-806. Every category with a REPLACES edge has one;
# score-validate fails if a category is missing.


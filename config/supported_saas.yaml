# The Source — products served with a support record (KEI-807 criterion 3; KEI-922).
#
# The read surface (api/v1/) publishes a support record, api/v1/saas/<saas_id>.json, for every
# catalogue product with at least one fully evaluated recommendation (docs/CATALOGUE.md), plus the
# products listed here, which stay served whatever happens to their counts. The Chrome extension
# (KEI-808) detects them locally, and the de-alwis.com template (KEI-809) renders one page per
# product at `compare_path`.
#
# The products below are the initial 20 (KEI-807). Selection rule (mechanical; recorded so it can
# be re-run and challenged): among catalogued SaaS products, rank by the number of recommended
# alternatives (export-guarded relationship + Replacement Fit publishable + credible alternative),
# then by how many independent upstream sources name the product, then by saas_id; take the top 20.
# Ranked 2026-09-30 from dataset as_of 2026-09-27 and scores evaluated 2026-09-29 (score_version
# 1.2.0). `scripts/rank_supported_saas.py` prints the ranking. Products added by KEI-922 take
# slug = saas_id, and a compare_path only once their status is ok.
#
# Detection rules for every product, these included, are in config/catalogue.yaml (KEI-922),
# with the semantics in source_pipeline/detect.py. Rules are checked locally by a client;
# nothing is sent anywhere.
#
# Adding or removing a product here needs no extension or site code change.

schema: the-source.supported/1
selected_by: claude-code
selected_at: "2026-09-30"
ticket: KEI-807

recommendations:
  min: 3      # a supported product with fewer is served with status insufficient_recommendations
  max: 5      # at most this many are served; more_available says how many were left out

products:

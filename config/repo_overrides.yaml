# Reviewed repository overrides.
#
# Some upstream lists link to a project's GitHub organisation, website or a repository
# that has since moved host, instead of to its repository. Such a claim cannot be
# verified and is rejected (`repo_url_not_a_repository` / `repository_not_found`).
# Where the project's main repository is unambiguous, it is mapped here. The mapping
# only tells the pipeline WHERE to look: the repository is then verified live like any
# other and is rejected if it is archived, unlicensed or stale. The upstream's original
# URL is kept in the record's imported.repo_urls, and the provenance entry is marked
# resolved_by: reviewed_override.
#
# Left unmapped on purpose (no single unambiguous repository, or host not verifiable):
# github.com/codimd, github.com/crusttech, github.com/oc-shopaholic, github.com/Pagure,
# github.com/Graphite-Docs, github.com/wireapp (several repositories, none primary),
# sourcehut.org, pleroma, otrs, mediagoblin.
# (An upstream that links straight to a repository, e.g. github.com/Pagure/pagure, needs
# no override and is verified as written.)

reviewed_at: "2026-09-27"
reviewed_by: claude-heavy


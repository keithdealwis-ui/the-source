# Renames confirmed as the SAME product under a new name and owner. Without an entry
# here, a repository renamed into a name its listings never used is excluded as
# `repository_identity_changed_since_listed`. Confirming a rename changes nothing else:
# the repository is still verified live and must pass every other rule.
#
# Left unconfirmed on purpose:
#   github.com/harness/harness      listed as Drone CI; now a broader platform, not the same product
#   github.com/mnfst/llm-gateway    listed as CASE / Manifest; now an LLM gateway
#   github.com/sortlist/max-cli     a CLI for a commercial service
confirmed_renames:
  github.com/linode/apl-core: "Otomi was acquired and rebranded as the Akamai/Linode App Platform; same codebase and product"
  github.com/ory/polis: "BoxyHQ SAML Jackson was transferred to Ory and renamed Polis; same codebase and product"

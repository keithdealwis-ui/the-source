# The Source — reviewed SaaS catalogue.
#
# A relationship is only ever validated against a SaaS product listed here. Names that
# upstreams use but that are not in this catalogue are rejected (`saas_not_in_catalogue`)
# and reported in data/dataset/reports/uncatalogued_saas_names.json for later review.
#
# Admission rule: a commercially operated, hosted software product sold to customers.
# Deliberately NOT admitted: open-source projects named as the thing being replaced
# (Pi-hole, Nextcloud, Plausible, Umami, Bitwarden, Elasticsearch, Odoo, SearX ...),
# desktop or on-device software (Photoshop, Sublime Text, Scrivener, Steam ...),
# libraries (React Hook Form, Vueform), hardware (Chromecast, Synology), features of a
# product that are not sold or metered on their own (Firebase Remote Config, GitHub
# Dependabot, GitHub Issues), products that have shut down (Mint, Pocket, Height,
# Skype), and products that are themselves open-source projects (Insomnia).
# A part of a larger platform IS admitted where it is sold or metered as its own
# product (GitHub Copilot, Codespaces and Actions; Cloudflare Pages, Tunnel, Access).
# An alias must mean the same product. A vendor name is not an alias for one of its
# products ("OpenAI" is not "OpenAI API"; "SAP" is not "SAP S/4HANA").
#
# Matching is by normalised key: text in parentheses is dropped, the rest is lowercased
# and stripped to letters and digits. `aliases` lists every other upstream spelling or
# plan tier that means the same product. Each entry: [name, domain, category, aliases].


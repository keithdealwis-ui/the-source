# Desk review of job-matched pairs (KEI-930; docs/JOB-MATCH.md).
#
# The full evaluation's core gate cannot discriminate a job-matched pair: the pair was selected on the very phrase
# the gate checks. So every pair in data/job_match/ledger.json was read, with the same standard as
# config/edge_review.yaml: what each thing IS, not how well it replaces the product. A pair is rejected when the
# project is a different kind of software, a library or framework rather than a product, a client, plugin or
# companion for another service, a list or template, does only a side feature, or fits the category but not that
# product. Unlike edge_review.yaml, standing pairs are listed too: a job-matched pair that is in neither list has
# not been reviewed and fails validation (fail closed).

# Second round (2026-10-21, the 25k corpus): the 2,440 new pairs of the rebuilt ledger were read by eight
# independent blind reviewers with the same standard (kei-923-artefacts/jm-review); evaluated pairs keep their place.
reviewed_at: "2026-10-21"
reviewed_by: claude-code
scope: "all 4557 pairs of data/job_match/ledger.json (the-source.job-match/1), as of 2026-10-21"


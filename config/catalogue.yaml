# The Source — V2.1 demand-led catalogue (KEI-922). docs/CATALOGUE.md explains all of it.
#
# Every product in config/saas_catalogue.yaml is a catalogue CANDIDATE and has one row here:
#   [saas_id, audience, [detection rules]]
# audience is b2b, b2c or both: who buys or uses the product, so a client can say "for teams" or
# "for you". Name, domain, category and aliases stay in saas_catalogue.yaml (one source of truth).
#
# Detection rules are compact strings (source_pipeline/detect.py has the full grammar):
#   slack.com                   exact host (one leading "www." on the page is ignored)
#   "*.slack.com"               host suffix, for per-customer subdomains ("*-my.sharepoint.com" also works)
#   atlassian.com/software/jira host plus a path prefix, matched on whole path segments
# The most specific matching rule wins (path beats no path, longer path beats shorter, exact host
# beats suffix). That is how one host carries several products: app.hubspot.com is HubSpot (CRM),
# app.hubspot.com/email is HubSpot Marketing Hub; acme.atlassian.net/wiki is Confluence,
# /jira is Jira and /jira/servicedesk is Jira Service Management.
#
# `python -m source_pipeline catalogue-rank` ranks the candidates and selects `target` of them into
# data/catalogue/selection.json. Ranking is by demand where demand evidence exists (aiq-kwi
# alternative-intent keyword volume imported into data/catalogue/demand/), and by credible supply:
# full evaluations, validated relationships, upstream lists naming the product, corpus projects
# that describe themselves as its alternative, and corpus projects doing the category's job.
# A catalogue entry's status (ok / partial / none_yet) is NEVER chosen here: canonical-build derives
# it from full evaluations alone (ok = at least 3 recommendations that passed the full evaluation).
#
# Every rule is a detection test: tests/test_catalogue.py checks that each rule's own URLs resolve
# to its product across all 602 candidates' rules, and that the `examples` below hold.

schema: the-source.catalogue-config/1
ticket: KEI-922
reviewed_at: "2026-10-18"
reviewed_by: linux-claude

target: 500

# Always selected whatever their rank: the products already served (config/supported_saas.yaml),
# the products the ticket names for evaluation, and (added by catalogue-rank) every candidate that
# already has a fully evaluated recommendation, so evidence is never dropped from the catalogue.
must_include: [slack, salesforce, zapier, 1password]

ranking:
  # Weights of the supply score (0-100). Each signal is capped, then scaled to its weight.
  supply:
    recommended: {weight: 35, cap: 5}           # fully evaluated, recommended relationships
    validated_relationships: {weight: 15, cap: 10}   # recommendable relationships in data/dataset
    upstream_sources: {weight: 15, cap: 7}      # independent upstream lists naming the product
    corpus_pairings: {weight: 15, cap: 10}      # corpus projects stating "alternative to <product>"
    category_supply: {weight: 20, cap: 300, scale: log}  # corpus projects doing the category's job
  # When demand evidence covers the candidates, rank = demand_weight * demand + (1 - demand_weight) * supply.
  # Without it the rank is supply alone, and every row says demand.status = unavailable.
  demand_weight: 0.5
  demand_cap_volume: 100000    # monthly alternative-intent searches; log-scaled to 0-100 below this

# Keyword modifiers that make a search an alternative-intent search for a product (aiq-kwi import).
alternative_intent: ["alternative", "alternatives", "open source", "opensource", "open-source",
                     "self hosted", "self-hosted", "selfhosted", "replacement", "free version of"]


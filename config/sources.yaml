# The Source — upstream source register and licence decisions (KEI-805 criterion 3).
#
# Every upstream is pinned to a commit and to the SHA-256 of the licence file that
# was read when the decision was made. If either the pinned commit's licence file
# hash differs from `licence_file_sha256`, harvest FAILS CLOSED for that source:
# the decision below was made about different licence text and must be re-reviewed.
#
# decision:
#   allow                  — may be harvested and may appear in a public export
#   allow_with_conditions  — may be harvested; `conditions` bind any public export
#   refuse                 — must not be harvested at all
#
# These are engineering licence readings recorded with their rationale. They are not
# legal advice; see docs/LICENCE-REVIEW.md for the residual questions put to Keith.

reviewed_at: "2026-09-27"
reviewed_by: claude-heavy
import_policy: >
  Facts only. From every source we import the product name, the repository URL, the
  project's self-declared licence identifier, a short category label and the claim
  "OSS project X is an alternative to SaaS product Y". We do not import descriptions,
  taglines, comparisons, pricing notes, setup estimates, logos or any other prose or
  media from any upstream, whatever its licence allows.

sources:
  - source_id: solvohq
    repo: SolvoHQ/awesome-self-host-saas-alternatives
    url: https://github.com/SolvoHQ/awesome-self-host-saas-alternatives
    pinned_commit: 5008048500e9a7856862ea87e2be30ac0048e1c8
    licence_file: LICENSE
    licence_file_sha256: 5c85788fb09f01adf06bb4f37b7e43b94684292fa3d21b8699190fa121b2fbb3
    licence_spdx: CC0-1.0
    github_detected_spdx: NOASSERTION
    decision: allow
    parser: solvohq
    parse_path: README.md
    priority: 1
    attribution: "SolvoHQ/awesome-self-host-saas-alternatives (CC0 1.0)"
    share_alike: false
    rationale: >
      The LICENSE file and the README "License" section both dedicate "the curation,
      ordering, and descriptive text of this list" to the public domain under CC0 1.0.
      GitHub reports NOASSERTION only because the LICENSE file is a short CC0 notice
      rather than the full legal code; the text itself is unambiguous. CC0 imposes no
      attribution or share-alike duty. We attribute anyway, as provenance.
    conditions:
      - "Only the repository at the pinned commit is harvested."
    refused_adjacent:
      - target: "osalt.dev website and its JSON API (code-rho-dun.vercel.app)"
        decision: refuse
        rationale: >
          The CC0 dedication covers the list in the repository. No licence or terms
          were found for the site or its API, so neither is harvested.

  - source_id: awesome-selfhosted
    repo: awesome-selfhosted/awesome-selfhosted-data
    url: https://github.com/awesome-selfhosted/awesome-selfhosted-data
    pinned_commit: c10a71ae91ccc513dc4329578896810c499c4b21
    licence_file: LICENSE
    licence_file_sha256: 34d1847bcb6c290b476a37bbb1aaab22e83af45f3af6ee20624d66c183249957
    licence_spdx: CC-BY-SA-3.0
    github_detected_spdx: NOASSERTION
    decision: allow_with_conditions
    parser: awesome_selfhosted
    parse_path: software
    priority: 2
    attribution: >-
      awesome-selfhosted-data, (c) the awesome-selfhosted community (see AUTHORS in the
      upstream repository), licensed CC BY-SA 3.0 Unported,
      https://github.com/awesome-selfhosted/awesome-selfhosted-data
    share_alike: true
    rationale: >
      CC BY-SA 3.0 Unported permits reproduction and adaptation, including
      commercially, provided attribution is given and adaptations are released under
      the same or a compatible licence. Harvesting is therefore permitted. The
      share-alike duty is the constraint: if our dataset is an "Adaptation" of their
      list, the adapted material must itself be CC BY-SA. We limit exposure by
      importing facts only and none of their descriptive text, and by tagging every
      record and edge that depends on this source so a public export can either carry
      the CC BY-SA terms for that material or leave it out.
    conditions:
      - "Attribution, the licence name and the licence URI accompany any public export that includes material from this source."
      - "No upstream description text is imported."
      - "Edges whose ONLY provenance is this source are flagged share_alike and are excluded from a public export unless the export is itself released under CC BY-SA or Keith approves otherwise."
      - "No technical measure may restrict onward use of material from this source."
    covers_also:
      - repo: awesome-selfhosted/awesome-selfhosted
        pinned_commit: 9c46157a85cff7fe010d9475857193bc6a4776e1
        licence_file_sha256: 16fd5f5e502cc76c18d8bc28e5f7f1e949a2228e9c1d4ea4e89b9f9087e39413
        note: >
          The seed named on the ticket. Its README is generated from
          awesome-selfhosted-data and carries the same CC BY-SA 3.0 licence, so the
          machine-readable data repository is parsed instead and the README is not
          parsed a second time. Same decision, same conditions.


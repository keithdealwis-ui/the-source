      - "No upstream description text is imported."

# Lists that were investigated and NOT harvested. Recorded so the decision is visible
# and is not silently re-litigated on a later run.
  # --- KEI-807: the manual / conversational intake path. Not an upstream list: it is The
  # Source's own ledger of repositories submitted through the authenticated intake surface
  # and admitted by intake.py after passing the same live verification, licence, activity
  # and identity rules as every other candidate. A repository enters the ledger only with a
  # SaaS relationship its own public statement evidences (description, topics or README).
  - source_id: intake
    kind: intake
    repo: keithdealwis-ui/the-source
    url: https://github.com/keithdealwis-ui/the-source/blob/main/data/intake/admitted/
    # Replaced at load time by the ledger's content hash (common.load_sources).
    pinned_commit: "0000000000000000000000000000000000000000"
    licence_file: docs/INTAKE-POLICY.md
    licence_file_sha256: ccc2475e96c83d6774422c036d4e7b7f495de3522c25bd03f852d78edff5a022
    licence_spdx: "n/a (The Source's own assessment record)"
    decision: allow
    parser: intake
    parse_path: data/intake/admitted/
    priority: 10
    attribution: >-
      The Source intake ledger (data/intake/admitted/): relationships stated by each
      project in its own public repository and assessed by The Source
    share_alike: false
    conditions:
      - "a relationship is recorded only with evidence from the project's own public repository"
      - "matched text is kept as a short evidence excerpt in the outcome record, never republished"
    rationale: >
      No third-party list is involved. Each relationship rests on the project's own public
      statement that it is an alternative to the SaaS product, captured as evidence in the
      intake outcome record, and on The Source's independent live verification. Keith (or a
      tool acting for him) submits a URL; a conversational or human preliminary assessment is
      advisory only and never recorded as approval.


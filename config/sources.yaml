  - source_id: altstack
    repo: altstackHQ/altstack-data
    url: https://github.com/altstackHQ/altstack-data
    pinned_commit: ca28a74d15d3cb3677706a861174b9ec350706a7
    licence_file: LICENSE
    licence_file_sha256: c76f488fd52bf3c9bac423df8456156f997835d1bc012f4786d07c1208aad409
    licence_spdx: "Apache-2.0 (LICENSE file) / CC-BY-4.0 (README statement)"
    github_detected_spdx: Apache-2.0
    decision: allow_with_conditions
    parser: altstack
    parse_path: data/tools.json
    priority: 8
    attribution: >-
      The AltStack data (altstackHQ/altstack-data), https://github.com/altstackHQ/altstack-data,
      licensed CC BY 4.0 per its README and Apache-2.0 per its LICENSE file; facts extracted,
      no text reproduced
    share_alike: false
    rationale: >
      The upstream is inconsistent about its own licence: the LICENSE file is the Apache
      License 2.0 text, while the README badge, file tree and "Using the Data" section
      all say the data is CC BY 4.0 and invite reuse with attribution. Both licences
      permit reuse, including commercially; neither is share-alike. Rather than choose,
      the conditions of BOTH are met: attribution with a link and licence name and a
      statement that the material was changed (CC BY 4.0), and the licence notice
      retained (Apache-2.0). The inconsistency is recorded as a residual question for
      Keith. The data contains affiliate referral URLs, pricing estimates and
      machine-written pros and cons; none of those is imported.
    conditions:
      - "Attribution names the source, links to it, names both licences and states that the material was modified."
      - "No referral URL, pricing figure, pros/cons text or description is imported."


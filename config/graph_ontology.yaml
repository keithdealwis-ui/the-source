# The Source — graph ontology (KEI-844).
#
# The reviewed vocabulary that turns what a repository host reports about a project into
# Technology, Capability and Use Case entities. It is the only place a free-text tag
# becomes a graph concept, so every mapping is inspectable and every edge it produces
# names the rule that produced it.
#
# Each concept:
#   id        stable, lower-case, never reused for a different meaning
#   name      display name
#   topics    GitHub topics that mean this concept. The owner applied the tag, so the
#             claim is the owner's; the mapping to the concept is ours.
#   languages host-reported language names that mean this concept (technology only)
#   keywords  whole-word patterns matched in the owner's description. Weaker than a
#             topic: the owner described the project, but did not tag it. Case-insensitive.
#   lists     curated lists whose inclusion criterion IS this concept
#
# Two spellings of one thing are one concept (postgres / postgresql / postgresql-database).
# A concept is added only when it helps answer a question someone will ask; the long tail
# of topics stays as tags on the project and remains searchable as text.

reviewed_at: "2026-09-29"
reviewed_by: claude-code

confidence:
  host_language: 1.0         # the host computed it from the code
  host_topic: 0.9            # the owner tagged it; the mapping is ours
  curated_list: 0.8          # a licence-cleared curated list admitted it for that reason
  description_keyword: 0.6   # the owner's description mentions it
  replaced_saas_category: 0.7  # the project is a validated alternative to a SaaS in that category


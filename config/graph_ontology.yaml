# INTEGRATES_WITH is inferred when a project's host topic is exactly a catalogued SaaS
# product's key and the project is not an alternative to that product. These keys are
# ordinary words or other things' names far more often than they are the product, so a
# topic equal to one of them is not evidence of an integration.
integration_topic_stoplist: [front, make, circle, linear, kit, merge, split, render, harvest, medium, readme,
                             heap, segment, railway, knock, courier, drift, crisp, loom, glean, sanity,
                             discourse-hosting, empower-personal-wealth, claude, chatgpt]

# The Source: controlled corpus expansion (KEI-923, V2.1 WP6). Method: docs/EXPANSION.md.
#
# Every source that can add members to the discovery corpus at scale is declared here, with its
# bound. `corpus-expand-harvest` (network) records what each source returned in
# data/expansion/frontier.jsonl. `corpus-expand-admit` then admits from that record under the
# Discover lane's bar (config/policy.yaml, unchanged), the intake noise gate and the quotas
# below. Nothing here can recommend: recommendations come only from data/canonical.
#
# Growth is a milestone, not a mandate. The corpus grows toward `milestones.target` only while
# the noise and golden-set checks (`obs-noise`, `obs-golden`) stay inside their bounds.
# `milestones.checkpoint` (50k) is a separate decision, never reached automatically.

schema: the-source.expansion/1

milestones:
  target: 25000
  checkpoint: 50000              # requires a review; admission refuses to go past target

# The active quality floor (S4.2). Each source's search asks the host only for repositories that
# already clear it, so a lookup is not spent on a certain rejection. Admission re-applies the
# Discover lane prefilter (found, public, not archived/disabled/empty/fork/mirror, pushed inside
# policy.yaml maintained_days) to the host's own answer regardless.
floor:
  min_stars: {github.com: 30, gitlab.com: 10, codeberg.org: 10}

# Archived or long-inactive projects that were notable are kept, apart, as a historical tier
# (data/historical/). They are never members of the active corpus, never counted toward the
# milestone, never served as discovery, and never recommended.
historical:
  min_stars: 1000

# Quotas: no source can dominate the expansion, and one run is bounded.
quotas:
  max_lookups_per_run: 40000     # host metadata lookups in one admission run
  max_admit_per_run: 16000       # admissions in one run
  # Share of one run's admissions any single source family may take.
  max_source_share: 0.60
  # Admissions one GitHub topic (or one list, one forge topic) may contribute in a run.
  max_per_query: 1200

# Intake noise gate (S4.3): rows that are not software a person would run are refused at intake
# with a named reason (source_pipeline/noise.py). Measured separately by `obs-noise`.
noise:
  gate: true
  # Initial thresholds from the V2.1 proposal; calibrated against the recorded baseline
  # (observability/noise-baseline.json): a measure may never be worse than
  # max(threshold, baseline + tolerance).
  thresholds:
    top10_discovery_irrelevant: 0.10
    top5_supported_irrelevant: 0.05
    intake_irrelevant: 0.10
  tolerance: 0.02
  integration_false_positives_in_recommendations: 0


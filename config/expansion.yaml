  # S4.1b Docker and Helm signals: repositories that ship a compose file, an image or a chart are
  # the ones a person can self-host. GitHub topics carry the signal; Artifact Hub carries charts.
  docker_signals:
    family: docker_helm
    pushed_within_days: 365
    topics: [docker-compose, docker-image, dockerfile, docker-container, helm-chart, helm-charts, helm,
             kubernetes-operator, k8s-operator]
  artifacthub:
    family: docker_helm
    # Artifact Hub package kinds: 0 Helm chart, 3 OLM operator, 12 container image.
    kinds: [0, 3, 12]
    # Packages read per kind, most-starred first (one detail call each). A package names its
    # source in `links` or `home_url`; only an address that is a repository root is kept, so a
    # chart inside a chart monorepo (…/tree/…) never stands in for the application it packages.
    max_packages_per_kind: 800
    page_size: 60

  # S4.1c Curated lists, as awesome.ecosyste.ms parses them. Seeds only: the addresses are kept,
  # nothing else (the lists are CC BY-SA; see docs/LICENCE-REVIEW.md, KEI-912).
  awesome_lists:
    family: awesome_lists
    lists:
      - https://github.com/awesome-selfhosted/awesome-selfhosted
      - https://github.com/awesome-foss/awesome-sysadmin
      - https://github.com/mikeroyal/Self-Hosting-Guide
      - https://github.com/pluja/awesome-privacy
      - https://github.com/Lissy93/awesome-privacy
      - https://github.com/RunaCapital/awesome-oss-alternatives
      - https://github.com/btw-so/open-source-alternatives
    max_pages: 40

  # S4.1d / S4.1e The independent forges. Topics are searched most-starred first.
  gitlab:

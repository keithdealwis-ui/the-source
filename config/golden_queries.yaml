# Golden queries (KEI-918 S0.4, docs/OBSERVABILITY.md). Measured by `python -m source_pipeline obs-golden`.
#
# Each query is a real MCP tool call. `relevant` is the set of projects a reviewer would accept as a
# credible answer, written from domain knowledge against the project universe (data/canonical and
# data/corpus) BEFORE looking at any ranking, fit or health score, so the measure is not the
# ranker grading itself. Ids without a host are github.com. Labels name projects The Source may not
# hold yet; those count as misses, which is the point (coverage). Labelled by linux-claude on
# 2026-10-17. Reviewed by Keith on 2026-10-20 and approved unchanged (KEI-930; relayed by attended claude-code);
# the baseline was re-recorded the same day (see docs/OBSERVABILITY.md, "Label review").
#
# recall@5 = relevant in the top 5 / min(5, relevant that can be returned)
#   (for a constrained call, relevant is first narrowed to the projects whose published facts meet
#   the constraints: a constraint that rightly excludes a project is not a miss)
# precision@5 = relevant in the top 5 / rows returned in the top 5 (no rows -> not counted)
# violations: any returned row that breaks a constraint or the publication rules, recomputed from the
#   published files independently of the server's own filter. Must be zero.
version: 1
k: 5
queries:

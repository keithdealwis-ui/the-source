# Reviewed licence readings (KEI-930, D6).
#
# Projects the automated licence detection misread: their repository is wholly under an OSI licence on the
# policy's recognised list, but the host reported NOASSERTION or the classifier matched ordinary licence wording
# (an ee/ path that holds no code, standard GPL "noncommercial" wording, a tri-licence with an AGPL option, ...).
# Each reading was verified against the licence files on 2026-10-20 and approved by Keith. A reading is not a
# licence exception: the project is then treated as ordinary open source, with no disclosure. The build refuses a
# reading whose spdx is not on policy.licence.recognised_spdx, or that lacks a human approver and approval_ref.


# Publication state of The Source (KEI-805 criterion 15, KEI-807 criterion 1).
#
# The canonical repository exists and is PRIVATE. Making it public is an external-facing
# action that needs Keith's explicit approval: set `status: public` only together with
# `approval` naming the decision (gate id or Linear comment). validate.py fails a build
# whose status is anything but private without an approval, or whose git remote is not
# the canonical repository.

status: private_repository          # private_repository | public
canonical_remote: github.com/keithdealwis-ui/the-source
approval: null                      # required when status is public, e.g. "gate-KEI-807-xxxx"
